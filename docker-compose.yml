name: trafficflow

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trafficflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file next to docker-compose.yml (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-trafficflow}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-trafficflow}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-trafficflow}
      - JWT_SECRET=${JWT_SECRET:-supersecretjwtforlocaldev1234567890}
      - TRUST_PROXY=1
      # Note: MIGRATIONS_DIR tells the backend to run migrations from the volume
      - MIGRATIONS_DIR=/database/migrations
    volumes:
      - ./database/migrations:/database/migrations:ro
      - uploads-data:/app/uploads
    # Exposing the port is optional since Nginx will proxy to it, but useful for debugging
    ports:
      - "127.0.0.1:4000:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db-data:
  uploads-data:
