# TrafficFlow services for Docker Compose.
#
# For now this runs PostgreSQL for local development. Phase 9 adds the
# backend, frontend and Nginx services to this same file.
#
#   docker compose up -d db     start PostgreSQL in the background
#   docker compose ps           "healthy" means it is ready for connections
#   docker compose logs db      show PostgreSQL's log
#   docker compose stop db      stop it (the data is kept)
#   docker compose down -v      remove it together with ALL its data
#
# Settings come from the .env file next to this file: copy .env.example to
# .env and choose a password. backend/.env must use the same values in its
# DATABASE_URL.

name: trafficflow

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trafficflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file next to docker-compose.yml (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-trafficflow}
    ports:
      # 127.0.0.1: only programs on this computer can connect, not other
      # machines on the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # The data survives restarts and "docker compose down" (but not "down -v").
      - db-data:/var/lib/postgresql/data
      # SQL files in this folder run once, when the data volume is first created.
      - ./database/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  db-data:
